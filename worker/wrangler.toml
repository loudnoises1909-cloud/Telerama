name = "telerama-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Keep variables added in the Cloudflare dashboard when a push redeploys the worker.
keep_vars = true

[vars]
# Comma-separated list of sites allowed to call this API.
ALLOWED_ORIGINS = "https://loudnoises1909-cloud.github.io,http://localhost:8000"
# Daily search caps (Claude costs about 3-4 cents a search). Raise these as more people use it.
DAILY_SEARCHES_PER_PERSON = "15"
DAILY_SEARCHES_TOTAL = "100"
# How hard Opus thinks when reading a request: "low" (fastest, cheapest), "medium" or "high".
PROFILE_EFFORT = "low"

# Secrets — set these with `npx wrangler secret put <NAME>`, never commit them:
#   ANTHROPIC_API_KEY   from console.anthropic.com
#   TMDB_TOKEN          TMDB "API Read Access Token" from themoviedb.org/settings/api

# Rate limits for searches (see src/limits.ts and checkLimits in src/index.ts).
# Bursts: at most 5 searches a minute per visitor, counted per Cloudflare location.
[[ratelimits]]
name = "SEARCH_BURST"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Daily caps (DAILY_SEARCHES_* above), counted in a Durable Object.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limits"]
